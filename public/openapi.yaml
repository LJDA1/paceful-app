openapi: 3.0.3
info:
  title: Paceful ERS API
  description: |
    The Paceful Emotional Readiness Score (ERS) API enables partners to integrate
    emotional intelligence into their platforms. Measure emotional readiness across
    5 clinical dimensions and get actionable insights.

    ## Authentication
    All endpoints require an API key passed via the `Authorization` header as a Bearer token:
    `Authorization: Bearer pk_live_your_key_here`.
    Get your API key at [/partners/signup](/partners/signup).

    ## Rate Limiting
    Rate limits are applied per API key. Check the `X-RateLimit-*` headers in responses:
    - `X-RateLimit-Limit`: Maximum requests per window
    - `X-RateLimit-Remaining`: Requests remaining in current window
    - `X-RateLimit-Reset`: Unix timestamp when the window resets

    ## Sandbox Mode
    Use a sandbox API key (prefix `pk_sandbox_`) for testing. Sandbox requests return
    deterministic mock data and don't count against rate limits.

    ## ERS Dimensions
    The ERS score is computed from 5 weighted dimensions:
    - **Emotional Stability** (25%): Mood variance, regulation patterns
    - **Self Reflection** (15%): Self-awareness, pattern recognition
    - **Coping Capacity** (20%): Healthy coping strategies, problem-solving
    - **Behavioral Engagement** (15%): Activity levels, routine consistency
    - **Social Readiness** (25%): Openness to relationships, trust signals

  version: 1.3.0
  contact:
    name: Paceful Partner Support
    email: partners@paceful.com
    url: https://paceful.com/partners
  license:
    name: Proprietary
    url: https://paceful.com/terms

servers:
  - url: https://paceful-app.vercel.app
    description: Production
  - url: http://localhost:3000
    description: Local Development

tags:
  - name: Assessment
    description: ERS assessment endpoints - questionnaire and text analysis
  - name: ERS
    description: Retrieve and manage ERS scores
  - name: Analytics
    description: Usage analytics and reporting
  - name: Configuration
    description: Partner configuration management
  - name: Health
    description: API health and status

security:
  - ApiKeyAuth: []

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      description: Check API availability and status. No authentication required.
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: 1.3.0

  /api/v1/assess/snapshot:
    post:
      tags: [Assessment]
      summary: Question-based ERS assessment
      description: |
        Submit answers to ERS assessment questions and receive a scored snapshot.

        **Two modes:**
        1. `action: "get_questions"` - Retrieve assessment questions
        2. `action: "submit"` - Submit answers and get ERS score
      operationId: assessSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/GetQuestionsRequest'
                - $ref: '#/components/schemas/SubmitAnswersRequest'
            examples:
              getQuestions:
                summary: Get assessment questions
                value:
                  action: get_questions
                  user_id: user_12345
              submitAnswers:
                summary: Submit assessment answers
                value:
                  action: submit
                  user_id: user_12345
                  answers:
                    q1: 4
                    q2: 3
                    q3: 5
                    q4: 2
                    q5: 4
      responses:
        '200':
          description: Assessment response
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QuestionsResponse'
                  - $ref: '#/components/schemas/SnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/assess/analyze:
    post:
      tags: [Assessment]
      summary: Text-based ERS analysis
      description: |
        Analyze unstructured text (journal entries, session notes, chat transcripts)
        and extract ERS signals using AI. Returns dimensional scores with reasoning.

        **Supported source types:**
        - `journal` - Personal journal entries
        - `session_notes` - Clinical/therapy session notes
        - `chat_transcript` - Conversation transcripts
        - `free_text` - General unstructured text
      operationId: analyzeText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeTextRequest'
            example:
              user_id: user_12345
              text: |
                Today was hard but I handled it better than I would have a few months ago.
                When my plans got canceled, I caught myself before spiraling. I've been
                doing breathing exercises and they actually help. I'm starting to recognize
                my patterns and I think I'm ready to start putting myself out there again.
              source_type: journal
              config:
                verbosity: standard
                tone: clinical
      responses:
        '200':
          description: Analysis results
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
              example:
                success: true
                data:
                  ers_snapshot: 67
                  dimensions:
                    emotional_stability:
                      score: 65
                      label: moderate
                      confidence: high
                      reasoning: "Emotional stability indicators are moderate. Key signals: caught myself before spiraling and breathing exercises help."
                      top_signals:
                        - "caught myself before spiraling"
                        - "breathing exercises help"
                    self_reflection:
                      score: 72
                      label: high
                      confidence: high
                      reasoning: "Self-reflection capacity indicators are strong. Key signals: recognize my patterns and handled it better than before."
                    coping_capacity:
                      score: 70
                      label: high
                      confidence: medium
                      reasoning: "Coping capacity indicators are strong. Key signals: breathing exercises and they actually help."
                    behavioral_engagement:
                      score: 58
                      label: moderate
                      confidence: medium
                      reasoning: "Behavioral engagement indicators are moderate. Key signals: putting myself out there."
                    social_readiness:
                      score: 62
                      label: moderate
                      confidence: medium
                      reasoning: "Social readiness indicators are moderate. Key signals: ready to start putting myself out there."
                  readiness_label: Rebuilding
                  confidence: medium
                  assessment_id: anlz_m2k8x9_abc123
                  timestamp: "2024-01-20T15:30:00Z"
                  source_type: journal
                  text_length: 312
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/assess/analyze/batch:
    post:
      tags: [Assessment]
      summary: Batch text analysis
      description: |
        Analyze multiple text entries and compute composite ERS scores with trends.
        Useful for analyzing historical data or multiple users at once.

        **Features:**
        - Up to 20 entries per request
        - Time-weighted composite scoring (recent entries weighted higher)
        - Trend detection across entries
        - Per-dimension trend analysis
      operationId: analyzeTextBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAnalyzeRequest'
            example:
              user_id: user_12345
              entries:
                - text: "Feeling overwhelmed today. Couldn't focus at all."
                  source_type: journal
                  timestamp: "2024-01-15T10:00:00Z"
                - text: "Better today. Applied for that promotion I've been thinking about."
                  source_type: journal
                  timestamp: "2024-01-18T10:00:00Z"
                - text: "Great weekend hiking with friends. Felt present and happy."
                  source_type: journal
                  timestamp: "2024-01-21T10:00:00Z"
              config:
                verbosity: standard
      responses:
        '200':
          description: Batch analysis results
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAnalyzeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/assess/{vertical}:
    post:
      tags: [Assessment]
      summary: Industry-vertical assessment
      description: |
        Run industry-specific signal detection alongside core ERS analysis.
        Combines a full five-dimension ERS score with a vertical-specific signal catalog
        and risk score.

        **Available verticals:** `cx`, `dating`, `gambling`, `healthcare`, `insurance`

        Use a sandbox key (`pk_sandbox_*`) for testing — returns deterministic mock data
        without consuming rate limits.
      operationId: assessVertical
      parameters:
        - name: vertical
          in: path
          required: true
          description: Vertical slug
          schema:
            type: string
            enum: [cx, dating, gambling, healthcare, insurance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - text
              properties:
                user_id:
                  type: string
                  description: External user ID
                text:
                  type: string
                  minLength: 20
                  description: Text to analyze
                source_type:
                  type: string
                  enum: [journal, session_notes, chat_transcript, free_text]
                  default: free_text
            example:
              user_id: player_123
              text: "I just need one more win to break even. I have been chasing my losses all week."
              source_type: chat_transcript
      responses:
        '200':
          description: Vertical assessment results
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                      vertical:
                        type: string
                      ers:
                        type: object
                        properties:
                          ers_snapshot:
                            type: number
                          dimensions:
                            $ref: '#/components/schemas/DimensionsMap'
                          readiness_label:
                            type: string
                          confidence:
                            type: string
                            enum: [low, medium, high]
                      vertical_analysis:
                        type: object
                        properties:
                          risk_score:
                            type: number
                            minimum: 0
                            maximum: 100
                          risk_level:
                            type: string
                            enum: [low, moderate, high, critical]
                          recommended_action:
                            type: string
                          signals:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Signal ID (e.g. GMB-001)
                                detected:
                                  type: boolean
                                confidence:
                                  type: string
                                  enum: [low, medium, high]
                                  nullable: true
                                evidence:
                                  type: string
                                  nullable: true
                          signals_detected:
                            type: integer
                          signals_total:
                            type: integer
                      source_type:
                        type: string
                      extraction_confidence:
                        type: string
                        enum: [low, medium, high]
                      assessed_at:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Vertical not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      summary: Get partner analytics summary
      description: |
        Retrieve aggregate analytics for your integration including:
        - Total users and active users
        - Score distributions
        - API usage metrics
        - Trend data
      operationId: getAnalyticsSummary
      parameters:
        - name: period
          in: query
          description: Time period for analytics
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            default: 30d
        - name: include_distributions
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
              example:
                success: true
                data:
                  period: 30d
                  users:
                    total: 1250
                    active: 890
                    new: 156
                  scores:
                    average: 58.3
                    median: 61
                    distribution:
                      healing: 312
                      rebuilding: 498
                      ready: 440
                  api_usage:
                    total_calls: 15420
                    by_endpoint:
                      assess_snapshot: 8200
                      assess_analyze: 4100
                      ers_get: 3120
                  trends:
                    score_change: 2.1
                    engagement_change: 5.3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/mood/{userId}/analytics:
    get:
      tags: [Analytics]
      summary: Get user mood analytics
      description: |
        Retrieve mood tracking analytics for a specific user including
        patterns, trends, and correlations with ERS scores.
      operationId: getMoodAnalytics
      parameters:
        - $ref: '#/components/parameters/userId'
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        '200':
          description: Mood analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoodAnalyticsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/partner/config:
    get:
      tags: [Configuration]
      summary: Get partner configuration
      description: |
        Retrieve your current partner configuration including
        response formatting preferences and feature flags.
      operationId: getPartnerConfig
      responses:
        '200':
          description: Partner configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerConfigResponse'
              example:
                success: true
                data:
                  partner_id: partner_abc123
                  verbosity: standard
                  tone: clinical
                  score_format: numerical
                  traffic_light_thresholds:
                    red_max: 33
                    yellow_max: 66
                  include_signals: true
                  include_trend: true
                  webhook_url: null
                  created_at: "2024-01-01T00:00:00Z"
                  updated_at: "2024-01-15T10:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Configuration]
      summary: Update partner configuration
      description: |
        Update your partner configuration. All fields are optional;
        only provided fields will be updated.
      operationId: updatePartnerConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerConfigUpdate'
            example:
              verbosity: clinical
              tone: motivational
              score_format: percentage
              include_signals: true
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerConfigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: |
        Partner API key passed as a Bearer token. Get yours at /partners/signup.
        - Production keys start with `pk_live_`
        - Sandbox keys start with `pk_sandbox_`

  headers:
    X-RateLimit-Limit:
      description: Maximum requests allowed per window
      schema:
        type: integer
        example: 1000
    X-RateLimit-Remaining:
      description: Requests remaining in current window
      schema:
        type: integer
        example: 999
    X-RateLimit-Reset:
      description: Unix timestamp when rate limit resets
      schema:
        type: integer
        example: 1705766400

  parameters:
    userId:
      name: userId
      in: path
      required: true
      description: External user ID (your system's user identifier)
      schema:
        type: string
        example: user_12345

  schemas:
    # Request Schemas
    GetQuestionsRequest:
      type: object
      required:
        - action
        - user_id
      properties:
        action:
          type: string
          enum: [get_questions]
        user_id:
          type: string
          description: External user ID

    SubmitAnswersRequest:
      type: object
      required:
        - action
        - user_id
        - answers
      properties:
        action:
          type: string
          enum: [submit]
        user_id:
          type: string
        answers:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 5
          description: Question ID to answer (1-5 scale) mapping

    AnalyzeTextRequest:
      type: object
      required:
        - user_id
        - text
      properties:
        user_id:
          type: string
          description: External user ID
        text:
          type: string
          minLength: 20
          maxLength: 10000
          description: Text to analyze (journal entry, session notes, etc.)
        source_type:
          type: string
          enum: [journal, session_notes, chat_transcript, free_text]
          default: free_text
          description: Type of text being analyzed
        config:
          $ref: '#/components/schemas/ResponseConfig'

    BatchAnalyzeRequest:
      type: object
      required:
        - user_id
        - entries
      properties:
        user_id:
          type: string
        entries:
          type: array
          items:
            type: object
            required:
              - text
            properties:
              text:
                type: string
                minLength: 20
              source_type:
                type: string
                enum: [journal, session_notes, chat_transcript, free_text]
              timestamp:
                type: string
                format: date-time
          minItems: 1
          maxItems: 20
        config:
          $ref: '#/components/schemas/ResponseConfig'

    ResponseConfig:
      type: object
      description: Response formatting configuration
      properties:
        verbosity:
          type: string
          enum: [minimal, standard, clinical]
          default: minimal
          description: |
            - `minimal`: Score and label only
            - `standard`: Includes reasoning and signals
            - `clinical`: Full detail with recommended actions
        tone:
          type: string
          enum: [clinical, casual, motivational]
          default: clinical
          description: Tone for reasoning text
        score_format:
          type: string
          enum: [numerical, percentage, tier_label, traffic_light]
          default: numerical
          description: Format for score values
        include_signals:
          type: boolean
          default: true
          description: Include supporting text signals
        include_trend:
          type: boolean
          default: true
          description: Include trend data

    PartnerConfigUpdate:
      type: object
      properties:
        verbosity:
          type: string
          enum: [minimal, standard, clinical]
        tone:
          type: string
          enum: [clinical, casual, motivational]
        score_format:
          type: string
          enum: [numerical, percentage, tier_label, traffic_light]
        traffic_light_thresholds:
          type: object
          properties:
            red_max:
              type: integer
              minimum: 0
              maximum: 100
            yellow_max:
              type: integer
              minimum: 0
              maximum: 100
        include_signals:
          type: boolean
        include_trend:
          type: boolean
        webhook_url:
          type: string
          format: uri
          nullable: true

    # Response Schemas
    QuestionsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            questions:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  text:
                    type: string
                  dimension:
                    type: string
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: integer
                        label:
                          type: string

    SnapshotResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            ers_snapshot:
              type: number
            dimensions:
              $ref: '#/components/schemas/DimensionsMap'
            readiness_label:
              type: string
              enum: [Not Ready, Healing, Rebuilding, Ready]
            confidence:
              type: string
              enum: [low, medium, high]
            assessment_id:
              type: string
            timestamp:
              type: string
              format: date-time

    AnalyzeResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            ers_snapshot:
              type: number
            dimensions:
              $ref: '#/components/schemas/DimensionsMap'
            readiness_label:
              type: string
            confidence:
              type: string
              enum: [low, medium, high]
            assessment_id:
              type: string
            timestamp:
              type: string
              format: date-time
            source_type:
              type: string
            text_length:
              type: integer
            extraction_confidence:
              type: string
              enum: [low, medium, high]
              description: Duplicate of confidence — extraction quality indicator
            welfare_flag:
              type: boolean
              description: |
                Always present. True when the text contains language indicating potential
                emotional risk beyond ordinary distress — hopelessness, expressions of not
                wanting to exist, self-harm ideation, sustained emptiness, or feeling like
                a burden. This is a human-escalation signal, not a clinical determination.
                Do not act on it automatically. Route to a human reviewer.
            welfare_note:
              type: string
              description: |
                Empty string when welfare_flag is false. When true, contains a specific
                description of what language triggered the flag. Suitable for inclusion
                in a reviewer handoff note.
            meta:
              type: object
              description: Present when verbosity is standard or clinical
              properties:
                verbosity:
                  type: string
                tone:
                  type: string
                score_format:
                  type: string
                api_version:
                  type: string
                model_version:
                  type: string
                extraction_notes:
                  type: string

    BatchAnalyzeResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            composite_ers_score:
              type: number
            readiness_label:
              type: string
            composite_confidence:
              type: string
            trend:
              type: object
              properties:
                direction:
                  type: string
                  enum: [improving, stable, declining]
                delta:
                  type: number
            dimensions:
              $ref: '#/components/schemas/DimensionsMapWithTrend'
            entry_results:
              type: array
              items:
                type: object
                properties:
                  index:
                    type: integer
                  ers_score:
                    type: number
                  confidence:
                    type: string
            entry_count:
              type: integer
            assessment_id:
              type: string
            timestamp:
              type: string
              format: date-time

    AnalyticsSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            period:
              type: string
            users:
              type: object
              properties:
                total:
                  type: integer
                active:
                  type: integer
                new:
                  type: integer
            scores:
              type: object
              properties:
                average:
                  type: number
                median:
                  type: number
                distribution:
                  type: object
            api_usage:
              type: object
              properties:
                total_calls:
                  type: integer
                by_endpoint:
                  type: object

    MoodAnalyticsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            user_id:
              type: string
            period:
              type: string
            mood_entries:
              type: integer
            average_mood:
              type: number
            mood_trend:
              type: string
            patterns:
              type: object
            ers_correlation:
              type: number

    PartnerConfigResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            partner_id:
              type: string
            verbosity:
              type: string
            tone:
              type: string
            score_format:
              type: string
            traffic_light_thresholds:
              type: object
            include_signals:
              type: boolean
            include_trend:
              type: boolean
            webhook_url:
              type: string
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    DimensionsMap:
      type: object
      properties:
        emotional_stability:
          $ref: '#/components/schemas/DimensionScore'
        self_reflection:
          $ref: '#/components/schemas/DimensionScore'
        coping_capacity:
          $ref: '#/components/schemas/DimensionScore'
        behavioral_engagement:
          $ref: '#/components/schemas/DimensionScore'
        social_readiness:
          $ref: '#/components/schemas/DimensionScore'

    DimensionsMapWithTrend:
      type: object
      properties:
        emotional_stability:
          allOf:
            - $ref: '#/components/schemas/DimensionScore'
            - type: object
              properties:
                trend:
                  type: string
                  enum: [improving, stable, declining]
        self_reflection:
          allOf:
            - $ref: '#/components/schemas/DimensionScore'
            - type: object
              properties:
                trend:
                  type: string
        coping_capacity:
          allOf:
            - $ref: '#/components/schemas/DimensionScore'
            - type: object
              properties:
                trend:
                  type: string
        behavioral_engagement:
          allOf:
            - $ref: '#/components/schemas/DimensionScore'
            - type: object
              properties:
                trend:
                  type: string
        social_readiness:
          allOf:
            - $ref: '#/components/schemas/DimensionScore'
            - type: object
              properties:
                trend:
                  type: string

    DimensionScore:
      type: object
      properties:
        score:
          type: number
          minimum: 0
          maximum: 100
        label:
          type: string
          enum: [very_low, low, moderate, high, very_high]
        confidence:
          type: string
          enum: [low, medium, high]
        reasoning:
          type: string
          description: Present when verbosity is standard or clinical
        top_signals:
          type: array
          items:
            type: string
          description: Present when include_signals is true
        recommended_action:
          type: string
          description: Present when verbosity is clinical

    Error:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
              enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, RATE_LIMITED, INTERNAL_ERROR]
            details:
              type: object
              additionalProperties: true

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "text must be at least 20 characters"
              code: BAD_REQUEST

    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "Invalid API key"
              code: UNAUTHORIZED

    Forbidden:
      description: API key lacks required permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "API key does not have access to this resource"
              code: FORBIDDEN

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "User not found"
              code: NOT_FOUND

    RateLimited:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Retry-After:
          description: Seconds until rate limit resets
          schema:
            type: integer
            example: 3600
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "Rate limit exceeded. Please retry after 3600 seconds."
              code: RATE_LIMITED

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "Internal server error"
              code: INTERNAL_ERROR
